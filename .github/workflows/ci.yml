name: CI — test

# NOT: `push` tetikleyicisi BİLİNÇLİ olarak YOK. develop/main push'larında testler
# zaten Deploy workflow'ları içinde koşar (jobs.test: uses ci.yml, workflow_call).
# Eskiden push tetikleyicisi de vardı → aynı push'ta İKİ CI run'ı aynı concurrency
# grubuna (ci-<ref>) düşüyor, cancel-in-progress biri diğerini İPTAL ediyordu →
# "test (push)" her seferinde cancelled (❌) görünüyor, elle re-run geçiyordu.
on:
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Asılı bir run 6 saat sürünmesin (varsayılan job timeout). apt bazen ASILIYOR.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: System deps (WeasyPrint)
        # GitHub-hosted runner apt'si zaman zaman ASILIYOR (fail değil, hang) →
        # tüm oturum boyunca "System deps (WeasyPrint)" adımı takılıyordu. Çözüm:
        # her apt komutunu `timeout` ile sar (hang → retryable hata), retry + IPv4.
        timeout-minutes: 8
        run: |
          set -eux
          printf 'Acquire::ForceIPv4 "true";\nAcquire::Retries "3";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-resilience >/dev/null
          apt_retry() {
            for i in 1 2 3; do
              if sudo timeout -k 20 120 "$@"; then return 0; fi
              echo "::warning::apt denemesi $i başarısız/timeout, tekrar: $*"
              sleep 5
            done
            echo "::error::apt 3 denemede başarısız: $*"
            return 1
          }
          apt_retry apt-get update
          apt_retry apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-xlib-2.0-0 libffi-dev

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pre-commit

      - name: Pre-commit hooks (ruff lint+format + secrets + temel kontroller)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Pytest
        env:
          ADMIN_PASSWORD: ci-test-password
          SECRET_KEY: ci-test-secret
        run: pytest -q --tb=short
